<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blok Smash · Ses seçimi</title><link rel="stylesheet" href="../../yazi/yazi.css">
<style>body{margin:0;padding:18px 14px 40px;font-family:"BS Metin",sans-serif;background:linear-gradient(180deg,#2a55c8,#0e1f63);color:#fff;min-height:100vh}
h1{font:800 30px/1 "BS Baslik";margin:4px 0 6px;text-align:center}p{text-align:center;opacity:.85;margin:0 0 18px;font-weight:700}
h2{font:800 22px/1 "BS Baslik";margin:22px 0 10px;color:#ffd23f}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
button{height:64px;border-radius:16px;border:3px solid #ffd23f;background:linear-gradient(180deg,#3f8ff0,#1b4fc0);color:#fff;font:800 18px/1 "BS Baslik";display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 0 #0c2a78;transition:scale .1s}
button:active{scale:.92}button.on{background:linear-gradient(180deg,#8cf05a,#2f9a1e);border-color:#fff}i{font-style:normal;font-size:14px;opacity:.8}</style></head><body>
