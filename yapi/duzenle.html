<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bölüm Yap · Foxi Smash</title>
<link rel="stylesheet" href="../yazi/yazi.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#0e2a5c;color:#fff;font-family:'Nunito','BS Govde',system-ui,sans-serif;overscroll-behavior:none}
body{background:radial-gradient(120% 70% at 50% 0%,#3a7bff 0%,#1747a8 45%,#0b2259 100%);display:flex;flex-direction:column;max-width:560px;margin:0 auto;user-select:none;min-height:100%}
body>*{flex-shrink:0}
h1{font-family:'BS Baslik','Baloo 2',sans-serif;font-weight:900;font-size:26px;margin:10px 12px 4px;color:#ffd23f;-webkit-text-stroke:1.5px #7a3b00;text-shadow:0 3px 0 #7a3b00,0 5px 8px rgba(0,0,0,.4);display:flex;align-items:center;gap:8px}
h1 small{font-size:13px;color:#cfe2ff;-webkit-text-stroke:0;text-shadow:none;font-weight:700;margin-left:auto}
.ust{display:flex;gap:6px;padding:4px 12px;flex-wrap:wrap;align-items:center}
.ust input{flex:1;min-width:120px;height:36px;border-radius:12px;border:2px solid #7fb2ff;background:#0d2f72;color:#fff;font:700 15px inherit;padding:0 10px;font-family:inherit}
.sec{display:flex;background:#0d2f72;border:2px solid #7fb2ff;border-radius:12px;overflow:hidden}
.sec button{border:0;background:none;color:#cfe2ff;font:800 13px inherit;font-family:inherit;padding:7px 9px}
.sec button.on{background:linear-gradient(#ffe066,#ffb400);color:#5a2a00}
.etk{font-size:12px;font-weight:800;color:#cfe2ff;margin-right:2px}
#alan{position:relative;margin:6px 12px 0;border-radius:18px;background:linear-gradient(#bfe8ff,#e6f6ff 70%,#9be08a 70.5%,#6cc35a);box-shadow:inset 0 0 0 3px rgba(255,255,255,.6),0 6px 0 #07193f;overflow:hidden;touch-action:none}
#cv{display:block;width:100%}
.palet{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px;padding:8px 12px}
.pb{border:0;border-radius:12px;background:#123c8f;box-shadow:0 3px 0 #07193f;color:#fff;font:800 10.5px inherit;font-family:inherit;padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .1s}
.pb canvas{width:44px;height:30px}
.pb.on{background:linear-gradient(#ffe066,#ffb400);color:#5a2a00;transform:translateY(-2px);box-shadow:0 5px 0 #7a3b00}
.pb:active{transform:scale(.93)}
.alt{display:flex;gap:6px;padding:4px 12px 12px;flex-wrap:wrap}
.btn{flex:1;min-width:70px;border:0;border-radius:14px;padding:10px 6px;font:900 14px inherit;font-family:'BS Baslik','Baloo 2',sans-serif;color:#fff;background:linear-gradient(#5aa0ff,#2563d8);box-shadow:0 4px 0 #0b2e78;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0b2e78}
.btn.y{background:linear-gradient(#7ef05a,#2fb52a);box-shadow:0 4px 0 #136b10;font-size:17px}
.btn.k{background:linear-gradient(#ff7a6a,#e0322a);box-shadow:0 4px 0 #7a1410}
.btn.s{background:linear-gradient(#ffe066,#ffb400);color:#5a2a00;box-shadow:0 4px 0 #7a3b00;text-shadow:none}
.btn.on{outline:3px solid #ffd23f}
#bilgi{font-size:12px;font-weight:800;color:#ffe9a8;padding:2px 14px;min-height:16px}
.perde{position:fixed;inset:0;background:rgba(3,12,40,.7);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
.perde.ac{display:flex}
.kart{background:linear-gradient(#2f6fe8,#163f9e);border:3px solid #9cc4ff;border-radius:20px;padding:14px;width:100%;max-width:440px;max-height:80vh;overflow:auto;box-shadow:0 8px 0 #07193f}
.kart h2{margin:0 0 10px;font-family:'BS Baslik','Baloo 2',sans-serif;font-weight:900;color:#ffd23f;-webkit-text-stroke:1px #7a3b00;text-shadow:0 2px 0 #7a3b00}
.kayit{display:flex;align-items:center;gap:8px;background:#0d2f72;border-radius:12px;padding:8px;margin-bottom:6px}
.kayit b{flex:1;font-size:15px}
.kayit button{border:0;border-radius:10px;padding:7px 10px;font:800 13px inherit;font-family:inherit}
textarea{width:100%;height:120px;border-radius:12px;border:2px solid #7fb2ff;background:#0d2f72;color:#fff;font:12px monospace;padding:8px}
</style>
</head>
<body>
<h1>Bölüm Yap <small id="say">0 blok</small></h1>
<div class="ust">
  <input id="ad" placeholder="Bölümün adı" maxlength="28">
</div>
<div class="ust">
  <span class="etk">Derinlik</span><div class="sec" id="dp"><button data-v="1">1</button><button data-v="2" class="on">2</button><button data-v="3">3</button></div>
  <span class="etk">Platform</span><div class="sec" id="hr"><button data-v="sabit" class="on">Sabit</button><button data-v="kay">Kayar</button><button data-v="asn">İner</button><button data-v="don">Döner</button></div>
</div>
<div class="ust">
  <span class="etk">Top</span><div class="sec" id="tp"><button data-v="0" class="on">Oto</button><button data-v="8">8</button><button data-v="10">10</button><button data-v="12">12</button><button data-v="15">15</button><button data-v="20">20</button></div>
  <button class="btn s" id="ayna" style="flex:0 0 auto;padding:7px 12px;font-size:13px">Ayna: Açık</button>
</div>
<div id="alan"><canvas id="cv"></canvas></div>
<div id="bilgi">Bir blok seç, sonra kutulara dokun. Dokunduğun yer bloğun sol alt köşesi olur.</div>
<div class="palet" id="palet"></div>
<div class="alt">
  <button class="btn" id="geri">Geri al</button>
  <button class="btn k" id="sil">Silgi</button>
  <button class="btn k" id="tem">Temizle</button>
</div>
<div class="alt" style="padding-top:0">
  <button class="btn s" id="kay">Kaydet</button>
  <button class="btn" id="lis">Bölümlerim</button>
  <button class="btn" id="pay">Gönder</button>
</div>
<div class="alt" style="padding-top:0"><button class="btn y" id="dene">▶ Oyunda Dene</button></div>

<div class="perde" id="perde"><div class="kart" id="kart"></div></div>

<script>
// Foxi Smash bolum duzenleyici (v6.12, Adem 18 Kas 2026: "bir ekran ac ben de kendim yapayim")
// Onden gorunus: 8 sutun, yarim kat satirlari. Her blok derinlik sayisi kadar arkaya kopyalanir.
// Oyunda dene: localStorage 'bs_dene' -> index.html?dene=1 (oyun.js her bolumu bununla kurar, ilerleme kaydedilmez).
const W = 8, HR = 28;   // sutun, yarim kat satiri (14 kat)
const B = [   // t: oyundaki tur, w: genislik, h: yukseklik (kat), r: renk, d: desen
  { t: 'oyK', ad: 'Kırmızı', w: 1, h: 1, r: '#e8283c', d: 'pati' }, { t: 'oyT', ad: 'Turuncu', w: 1, h: 1, r: '#ff7a14', d: 'pati' },
  { t: 'oyS', ad: 'Sarı', w: 1, h: 1, r: '#ffc400', d: 'pati' }, { t: 'oyY', ad: 'Yeşil', w: 1, h: 1, r: '#1fb94a', d: 'pati' },
  { t: 'oyM', ad: 'Mavi', w: 1, h: 1, r: '#1f7ef0', d: 'pati' }, { t: 'oyP', ad: 'Mor', w: 1, h: 1, r: '#8a3cf0', d: 'pati' },
  { t: 'oyA', ad: 'Foxi Küp', w: 1, h: 1, r: '#ff8a1c', d: 'foxi' },
  { t: 'ksSiseM', ad: 'Kavanoz', w: 1, h: 1, r: '#8a3cf0', d: 'kav' }, { t: 'ksSiseY', ad: 'Kavanoz', w: 1, h: 1, r: '#1fb94a', d: 'kav' }, { t: 'ksSiseB', ad: 'Kavanoz', w: 1, h: 1, r: '#1f7ef0', d: 'kav' },
  { t: 'ksBuz', ad: 'Buz', w: 1, h: 1, r: '#8fd8ff', d: 'buz' }, { t: 'ksBuz3', ad: 'Buz 3', w: 3, h: 1, r: '#8fd8ff', d: 'buz' },
  { t: 'ksTas', ad: 'Taş', w: 1, h: 1, r: '#a4abc4', d: 'tas' }, { t: 'ksTas2', ad: 'Taş 2', w: 2, h: 1, r: '#a4abc4', d: 'tas' },
  { t: 'ksTas3', ad: 'Taş 3', w: 3, h: 1, r: '#a4abc4', d: 'tas' }, { t: 'ksTas4', ad: 'Taş 4', w: 4, h: 1, r: '#a4abc4', d: 'tas' },
  { t: 'ksFici', ad: 'Kütük', w: 1, h: 1, r: '#c9782c', d: 'kutuk' },
  { t: 'ksKalas1', ad: 'Kalas 1', w: 1, h: 0.5, r: '#f0962e', d: 'tahta' }, { t: 'ksKalas2', ad: 'Kalas 2', w: 2, h: 0.5, r: '#f0962e', d: 'tahta' },
  { t: 'ksKalas3', ad: 'Kalas 3', w: 3, h: 0.5, r: '#f0962e', d: 'tahta' }, { t: 'ksDirek', ad: 'Direk', w: 1, h: 2, r: '#d9822a', d: 'tahta' },
  { t: 'ksSandik', ad: 'Sandık', w: 1, h: 1, r: '#e8892c', d: 'sandik' }, { t: 'ksTNT', ad: 'TNT', w: 1, h: 1, r: '#e0322a', d: 'tnt' },
  { t: 'ksKemer', ad: 'Kemer', w: 3, h: 2, r: '#6b78b8', d: 'kemer' }
];
const BT = Object.fromEntries(B.map((b) => [b.t, b]));
const $ = (i) => document.getElementById(i);
const cv = $('cv'), cx = cv.getContext('2d');
let sec = B[0], silgi = false, ayna = true, dp = 2, hr = 'sabit', topS = 0;
let P = [];        // yerlesen bloklar: { t, c (sol sutun), r (alt yarim satir) }
const GECMIS = [];
let CEL = 30, OX = 0, OY = 0, DPR = 1;

function boyut() {
  DPR = Math.min(2, devicePixelRatio || 1);
  const gw = $('alan').clientWidth;
  CEL = Math.floor(Math.min((gw - 24) / W, Math.max(280, innerHeight * 0.58) / (HR / 2 + 0.9)));
  const w = gw, h = Math.round(CEL * (HR / 2 + 0.9));
  cv.width = w * DPR; cv.height = h * DPR; cv.style.height = h + 'px';
  OX = Math.round((w - CEL * W) / 2); OY = h - Math.round(CEL * 0.75);   // platform ustu
  ciz();
}
const hy = () => CEL / 2;   // yarim satir yuksekligi

function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function koyu(hex, k) { const n = parseInt(hex.slice(1), 16); const f = (v) => Math.max(0, Math.min(255, Math.round(v * k))); return 'rgb(' + f(n >> 16) + ',' + f((n >> 8) & 255) + ',' + f(n & 255) + ')'; }
function blokCiz(g, b, x, y, w, h, uyari) {
  const p = Math.max(1, w * 0.04), R = Math.min(w, h) * 0.18;
  x += p; y += p; w -= 2 * p; h -= 2 * p;
  const gr = g.createLinearGradient(0, y, 0, y + h); gr.addColorStop(0, koyu(b.r, 1.35)); gr.addColorStop(0.55, b.r); gr.addColorStop(1, koyu(b.r, 0.7));
  if (b.d === 'kemer') {   // ortasi bos kemer
    g.fillStyle = gr; rr(g, x, y, w, h, R); g.fill();
    g.globalCompositeOperation = 'destination-out'; g.beginPath(); const kr = w / 6; g.moveTo(x + w / 3, y + h); g.lineTo(x + w / 3, y + h * 0.55); g.arc(x + w / 2, y + h * 0.55, kr, Math.PI, 0); g.lineTo(x + w * 2 / 3, y + h); g.fill(); g.globalCompositeOperation = 'source-over';
  } else if (b.d === 'kav') {   // kavanoz: kapak + cam govde
    g.fillStyle = 'rgba(255,255,255,.35)'; rr(g, x + w * 0.08, y + h * 0.2, w * 0.84, h * 0.8, R); g.fill();
    g.fillStyle = gr; rr(g, x + w * 0.14, y + h * 0.32, w * 0.72, h * 0.62, R * 0.8); g.fill();
    g.fillStyle = '#fff'; rr(g, x + w * 0.05, y + h * 0.02, w * 0.9, h * 0.22, R * 0.6); g.fill();
    g.strokeStyle = '#e03030'; g.lineWidth = Math.max(1, w * 0.04); g.setLineDash([w * 0.08, w * 0.08]); g.beginPath(); g.moveTo(x + w * 0.08, y + h * 0.13); g.lineTo(x + w * 0.92, y + h * 0.13); g.stroke(); g.setLineDash([]);
  } else if (b.d === 'kutuk') {
    g.fillStyle = gr; rr(g, x + w * 0.06, y, w * 0.88, h, w * 0.3); g.fill();
    g.strokeStyle = koyu(b.r, 0.6); g.lineWidth = Math.max(1, w * 0.035); for (const f of [0.3, 0.5, 0.7]) { g.beginPath(); g.moveTo(x + w * 0.1, y + h * f); g.lineTo(x + w * 0.9, y + h * f); g.stroke(); }
  } else {
    g.fillStyle = gr; rr(g, x, y, w, h, R); g.fill();
    g.fillStyle = 'rgba(255,255,255,.35)'; rr(g, x + w * 0.08, y + h * 0.07, w * 0.84, h * 0.16, R * 0.5); g.fill();
    g.strokeStyle = koyu(b.r, 0.55); g.lineWidth = Math.max(1, Math.min(w, h) * 0.05);
    if (b.d === 'pati') {   // patili plaka: cerceve + pati izi
      g.strokeStyle = 'rgba(255,255,255,.55)'; rr(g, x + w * 0.12, y + h * 0.12, w * 0.76, h * 0.76, R * 0.6); g.stroke();
      g.fillStyle = 'rgba(255,255,255,.75)'; const m = x + w / 2, n = y + h * 0.58, s = w * 0.1;
      g.beginPath(); g.ellipse(m, n, s * 1.5, s * 1.2, 0, 0, 7); g.fill();
      for (const [a, b2] of [[-1.5, -1.6], [-0.5, -2.3], [0.5, -2.3], [1.5, -1.6]]) { g.beginPath(); g.arc(m + a * s, n + b2 * s, s * 0.55, 0, 7); g.fill(); }
    } else if (b.d === 'foxi') {   // Foxi yuzu
      g.fillStyle = '#fff3e0'; g.beginPath(); g.ellipse(x + w / 2, y + h * 0.68, w * 0.3, h * 0.2, 0, 0, 7); g.fill();
      g.fillStyle = '#222'; for (const a of [0.33, 0.67]) { g.beginPath(); g.arc(x + w * a, y + h * 0.45, w * 0.07, 0, 7); g.fill(); }
      g.beginPath(); g.arc(x + w / 2, y + h * 0.62, w * 0.05, 0, 7); g.fill();
      g.fillStyle = koyu(b.r, 0.7); for (const a of [0.15, 0.85]) { g.beginPath(); g.moveTo(x + w * a - w * 0.1, y + h * 0.28); g.lineTo(x + w * a, y + h * 0.05); g.lineTo(x + w * a + w * 0.1, y + h * 0.28); g.fill(); }
    } else if (b.d === 'buz') {
      g.strokeStyle = 'rgba(255,255,255,.8)'; g.beginPath(); g.moveTo(x + w * 0.2, y + h * 0.75); g.lineTo(x + w * 0.4, y + h * 0.5); g.lineTo(x + w * 0.35, y + h * 0.35); g.stroke();
      g.strokeStyle = '#3aa0e8'; rr(g, x + 1, y + 1, w - 2, h - 2, R); g.stroke();
    } else if (b.d === 'tas') {
      g.fillStyle = '#ffd23f'; const s = Math.min(w, h) * 0.12; for (let i = 0; i < Math.round(w / h); i++) { const m = x + h * (i + 0.5); g.beginPath(); g.arc(m, y + h * 0.58, s, 0, 7); g.fill(); }
    } else if (b.d === 'tahta' || b.d === 'sandik') {
      g.strokeStyle = koyu(b.r, 0.65); const n = b.d === 'sandik' ? 3 : Math.max(2, Math.round(h / (CEL * 0.25))); for (let i = 1; i < n; i++) { g.beginPath(); if (h > w) { g.moveTo(x + w * i / n, y + 2); g.lineTo(x + w * i / n, y + h - 2); } else { g.moveTo(x + 2, y + h * i / n); g.lineTo(x + w - 2, y + h * i / n); } g.stroke(); }
      if (b.d === 'sandik') { g.strokeStyle = '#7a8090'; g.lineWidth *= 1.6; rr(g, x + 1, y + 1, w - 2, h - 2, R); g.stroke(); }
    } else if (b.d === 'tnt') {
      g.fillStyle = '#fff'; g.font = '900 ' + Math.round(h * 0.38) + 'px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('TNT', x + w / 2, y + h * 0.58);
    }
  }
  if (uyari) { g.strokeStyle = '#ff2020'; g.lineWidth = 3; g.setLineDash([5, 4]); rr(g, x - p + 1, y - p + 1, w + 2 * p - 2, h + 2 * p - 2, R); g.stroke(); g.setLineDash([]); }
}

// ---------- izgara hesaplari ----------
const kap = (b) => ({ c0: b.c, c1: b.c + BT[b.t].w - 1, r0: b.r, r1: b.r + BT[b.t].h * 2 - 1 });
function dolu() { const m = {}; P.forEach((b, n) => { const k = kap(b); for (let c = k.c0; c <= k.c1; c++) for (let r = k.r0; r <= k.r1; r++) m[c + ',' + r] = n; }); return m; }
function destekli(b, m) { if (b.r === 0) return true; const k = kap(b); for (let c = k.c0; c <= k.c1; c++) if (m[c + ',' + (b.r - 1)] !== undefined) return true; return false; }

function ciz() {
  const g = cx; g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, cv.width, cv.height);
  // izgara
  g.strokeStyle = 'rgba(20,60,140,.14)'; g.lineWidth = 1;
  for (let c = 0; c <= W; c++) { g.beginPath(); g.moveTo(OX + c * CEL, OY); g.lineTo(OX + c * CEL, OY - HR * hy()); g.stroke(); }
  for (let r = 0; r <= HR; r++) { g.strokeStyle = r % 2 ? 'rgba(20,60,140,.06)' : 'rgba(20,60,140,.16)'; g.beginPath(); g.moveTo(OX, OY - r * hy()); g.lineTo(OX + W * CEL, OY - r * hy()); g.stroke(); }
  if (ayna) { g.strokeStyle = 'rgba(255,120,0,.45)'; g.setLineDash([6, 6]); g.beginPath(); g.moveTo(OX + W * CEL / 2, OY); g.lineTo(OX + W * CEL / 2, OY - HR * hy()); g.stroke(); g.setLineDash([]); }
  // platform
  const pg = g.createLinearGradient(0, OY, 0, OY + CEL * 0.5); pg.addColorStop(0, '#ffe066'); pg.addColorStop(1, '#c77a00');
  g.fillStyle = pg; rr(g, OX - CEL * 0.4, OY + 2, W * CEL + CEL * 0.8, CEL * 0.38, CEL * 0.19); g.fill();
  g.fillStyle = '#8a4fd8'; g.fillRect(OX + W * CEL / 2 - CEL * 0.25, OY + CEL * 0.4, CEL * 0.5, CEL * 0.4);
  // bloklar
  const m = dolu(); let uy = 0;
  P.forEach((b) => { const d = BT[b.t], u = !destekli(b, m); if (u) uy++; blokCiz(g, d, OX + b.c * CEL, OY - (b.r + d.h * 2) * hy(), d.w * CEL, d.h * 2 * hy(), u); });
  $('say').textContent = P.length * dp + ' blok';
  $('bilgi').textContent = uy ? uy + ' blok havada (kırmızı çizgili): oyunda düşer. Altına blok koy.' : silgi ? 'Silgi: silmek istediğin bloğa dokun.' : 'Seçili: ' + sec.ad + '. Dokunduğun yer bloğun sol alt köşesi olur.';
}

// ---------- yerlestirme ----------
function kaydetGecmis() { GECMIS.push(JSON.stringify(P)); if (GECMIS.length > 80) GECMIS.shift(); }
function koy(c, r) {
  const d = sec; if (c + d.w > W) c = W - d.w; if (c < 0) return; if (r + d.h * 2 > HR) return;
  const yeni = { t: d.t, c, r }, k = kap(yeni);
  P = P.filter((b) => { const q = kap(b); return q.c1 < k.c0 || q.c0 > k.c1 || q.r1 < k.r0 || q.r0 > k.r1; });   // ustune koyulan bloklari kaldir
  P.push(yeni);
}
function sil(c, r) { const m = dolu(), n = m[c + ',' + r]; if (n === undefined) return false; P.splice(n, 1); return true; }
function hucre(e) { const b = cv.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top; return { c: Math.floor((x - OX) / CEL), r: Math.floor((OY - y) / hy()) }; }
let son = null, basili = false;
function dokun(e) {
  const { c, r } = hucre(e); if (c < 0 || c >= W || r < 0 || r >= HR) return;
  const key = c + ',' + r; if (son === key) return; son = key;
  if (silgi) { if (sil(c, r) && ayna) sil(W - 1 - c, r); }
  else {
    const m = dolu(); if (m[c + ',' + r] !== undefined && P[m[c + ',' + r]].t === sec.t && basili !== 'ilk') return;
    // satiri bloga oturt: yarim satirda tam boylu blok, alttaki dolu satirin hemen ustune
    let rr0 = r; if (sec.h >= 1 && rr0 % 2 && m[c + ',' + (rr0 - 1)] === undefined) rr0--;
    koy(c, rr0); const ac = W - c - sec.w; if (ayna && ac !== c && ac >= 0) koy(ac, rr0);
  }
  basili = true; ciz();
}
cv.addEventListener('pointerdown', (e) => { kaydetGecmis(); son = null; basili = 'ilk'; cv.setPointerCapture(e.pointerId); dokun(e); });
cv.addEventListener('pointermove', (e) => { if (basili) dokun(e); });
addEventListener('pointerup', () => { basili = false; son = null; });

// ---------- palet ----------
B.forEach((b) => {
  const el = document.createElement('button'); el.className = 'pb' + (b === sec ? ' on' : '');
  const c = document.createElement('canvas'); c.width = 88; c.height = 60; const g = c.getContext('2d');
  const ol = Math.min(80 / b.w, 52 / b.h, 40); const w = ol * b.w, h = ol * b.h; const sv = CEL; CEL = ol * 2; blokCiz(g, b, (88 - w) / 2, (60 - h) / 2, w, h); CEL = sv;
  el.appendChild(c); el.appendChild(document.createTextNode(b.ad));
  el.onclick = () => { sec = b; silgi = false; $('sil').classList.remove('on'); document.querySelectorAll('.pb').forEach((x) => x.classList.toggle('on', x === el)); ciz(); };
  $('palet').appendChild(el);
});
function secici(id, f) { $(id).querySelectorAll('button').forEach((b) => b.onclick = () => { $(id).querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); f(b.dataset.v); ciz(); }); }
function seciciAyarla(id, v) { $(id).querySelectorAll('button').forEach((x) => x.classList.toggle('on', x.dataset.v === String(v))); }
secici('dp', (v) => dp = +v); secici('hr', (v) => hr = v); secici('tp', (v) => topS = +v);
$('ayna').onclick = () => { ayna = !ayna; $('ayna').textContent = 'Ayna: ' + (ayna ? 'Açık' : 'Kapalı'); ciz(); };
$('sil').onclick = () => { silgi = !silgi; $('sil').classList.toggle('on', silgi); ciz(); };
$('geri').onclick = () => { if (GECMIS.length) { P = JSON.parse(GECMIS.pop()); ciz(); } };
$('tem').onclick = () => { if (P.length && confirm('Hepsi silinsin mi?')) { kaydetGecmis(); P = []; ciz(); } };

// ---------- kayit / oyunda dene / gonder ----------
const KEY = 'bs_duzen';
const liste = () => { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } };
const yazListe = (a) => { try { localStorage.setItem(KEY, JSON.stringify(a)); } catch (e) {} };
const tasarim = () => ({ ad: $('ad').value.trim() || 'Benim Bölümüm', dp, hr, top: topS, b: P.map((b) => [b.t, b.c, b.r]) });
function yukle(t) { $('ad').value = t.ad || ''; dp = t.dp || 2; hr = t.hr || 'sabit'; topS = t.top || 0; P = (t.b || []).filter((x) => BT[x[0]]).map(([t, c, r]) => ({ t, c, r })); seciciAyarla('dp', dp); seciciAyarla('hr', hr); seciciAyarla('tp', topS); GECMIS.length = 0; ciz(); }
// oyunun bolum bicimi: [i (orta), kat (alt), k, tur, platform]
function bolum(t) {
  const c = [];
  for (const [tt, col, r] of t.b) { const d = BT[tt]; if (!d) continue; for (let k = 0; k < t.dp; k++) c.push([col + (d.w - 1) / 2, r / 2, k, tt, 0]); }
  const o = { ad: t.ad, c };
  if (t.hr === 'kay') o.pl = [{ x: 0, z: 0, kay: { a: 2, h: 0.9 } }];
  else if (t.hr === 'asn') o.pl = [{ x: 0, z: 0, asn: { a: 1.3, h: 0.85 } }];
  else if (t.hr === 'don') o.don = 0.35;
  if (t.top) o.top = t.top;
  return o;
}
function kaydet(sessiz) {
  const t = tasarim(); const a = liste(); const i = a.findIndex((x) => x.ad === t.ad);
  if (i >= 0) a[i] = t; else a.push(t); yazListe(a);
  try { localStorage.setItem(KEY + '_son', JSON.stringify(t)); } catch (e) {}
  if (!sessiz) { $('bilgi').textContent = '"' + t.ad + '" kaydedildi.'; }
}
$('kay').onclick = () => { if (!P.length) return; kaydet(); };
$('dene').onclick = () => {
  if (!P.length) { $('bilgi').textContent = 'Önce birkaç blok koy.'; return; }
  kaydet(true);
  try { localStorage.setItem('bs_dene', JSON.stringify(bolum(tasarim()))); } catch (e) {}
  location.href = 'index.html?dene=1';
};
const perde = (h) => { $('kart').innerHTML = h; $('perde').classList.add('ac'); };
$('perde').onclick = (e) => { if (e.target.id === 'perde') $('perde').classList.remove('ac'); };
$('lis').onclick = () => {
  const a = liste();
  perde('<h2>Bölümlerim</h2>' + (a.length ? a.map((t, i) => '<div class="kayit"><b>' + t.ad.replace(/</g, '') + '</b><small>' + t.b.length * t.dp + ' blok</small><button data-ac="' + i + '" style="background:#ffd23f">Aç</button><button data-sil="' + i + '" style="background:#ff7a6a;color:#fff">Sil</button></div>').join('') : '<p>Henüz kayıtlı bölüm yok.</p>') + '<button class="btn" id="kapat" style="width:100%;margin-top:6px">Kapat</button>');
  $('kart').querySelectorAll('[data-ac]').forEach((b) => b.onclick = () => { yukle(liste()[+b.dataset.ac]); $('perde').classList.remove('ac'); });
  $('kart').querySelectorAll('[data-sil]').forEach((b) => b.onclick = () => { const a2 = liste(); if (confirm('"' + a2[+b.dataset.sil].ad + '" silinsin mi?')) { a2.splice(+b.dataset.sil, 1); yazListe(a2); $('lis').onclick(); } });
  $('kapat').onclick = () => $('perde').classList.remove('ac');
};
$('pay').onclick = async () => {
  const a = liste(); if (P.length) { const t = tasarim(); const i = a.findIndex((x) => x.ad === t.ad); if (i >= 0) a[i] = t; else a.push(t); }
  if (!a.length) { $('bilgi').textContent = 'Gönderilecek bölüm yok.'; return; }
  const metin = 'FOXI-BOLUMLER ' + JSON.stringify(a);
  if (navigator.share) { try { await navigator.share({ title: 'Foxi Smash bölümlerim', text: metin }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  perde('<h2>Gönder</h2><p>Bu yazıyı kopyalayıp bana gönder:</p><textarea readonly>' + metin.replace(/</g, '') + '</textarea><button class="btn" id="kapat" style="width:100%;margin-top:6px">Kapat</button>');
  const ta = $('kart').querySelector('textarea'); ta.select(); try { navigator.clipboard.writeText(metin); } catch (e) {}
  $('kapat').onclick = () => $('perde').classList.remove('ac');
};

addEventListener('resize', boyut);
try { const s = JSON.parse(localStorage.getItem(KEY + '_son') || 'null'); if (s) yukle(s); } catch (e) {}
boyut();
</script>
</body>
</html>
